<svg xmlns="http://www.w3.org/2000/svg" width="380" height="165" viewBox="0 0 380 165" fill="none" role="img" aria-label="Most used languages">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #2f80ed; }
    .lang { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #434d58; }
    .pct { fill: #858585; }
  </style>
  <rect x="0" y="0" width="380" height="165" fill="none" />
  <text x="25" y="33" class="title">Most Used Languages</text>
  <clipPath id="bar"><rect x="25" y="50" width="330" height="8" rx="4" /></clipPath>
  <g clip-path="url(#bar)">
    <rect x="25.0" y="50" width="188.7" height="8" fill="#3572A5" />
    <rect x="213.7" y="50" width="130.3" height="8" fill="#3178c6" />
    <rect x="344.0" y="50" width="7.1" height="8" fill="#DA5B0B" />
    <rect x="351.1" y="50" width="2.0" height="8" fill="#427819" />
    <rect x="353.1" y="50" width="1.2" height="8" fill="#563d7c" />
    <rect x="354.3" y="50" width="0.7" height="8" fill="#f1e05a" />
  </g>
  <circle cx="30.0" cy="76" r="5" fill="#3572A5" /><text x="41.0" y="80" class="lang">Python <tspan class="pct">57.2%</tspan></text>
  <circle cx="195.0" cy="76" r="5" fill="#3178c6" /><text x="206.0" y="80" class="lang">TypeScript <tspan class="pct">39.5%</tspan></text>
  <circle cx="30.0" cy="100" r="5" fill="#DA5B0B" /><text x="41.0" y="104" class="lang">Jupyter Notebook <tspan class="pct">2.1%</tspan></text>
  <circle cx="195.0" cy="100" r="5" fill="#427819" /><text x="206.0" y="104" class="lang">Makefile <tspan class="pct">0.6%</tspan></text>
  <circle cx="30.0" cy="124" r="5" fill="#563d7c" /><text x="41.0" y="128" class="lang">CSS <tspan class="pct">0.4%</tspan></text>
  <circle cx="195.0" cy="124" r="5" fill="#f1e05a" /><text x="206.0" y="128" class="lang">JavaScript <tspan class="pct">0.2%</tspan></text>
</svg>
